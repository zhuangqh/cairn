disabled_rules:
  - trailing_whitespace
  - todo
  - line_length
  - multiple_closures_with_trailing_closure

opt_in_rules:
  - empty_count
  - force_unwrapping
  - implicit_return

included:
  - Cairn
  - CairnTests

excluded:
  - build
  - DerivedData

identifier_name:
  excluded:
    - to
    - id

# Custom rules to enforce i18n discipline from day one (see PRD §5.5).
custom_rules:
  localization_key_only_in_text:
    name: "Hardcoded Text literal"
    # Flags Text("...") whose literal contains a space — heuristic for raw English
    # phrases instead of a localization key such as Text("overview.title").
    regex: 'Text\(\"[^\"\n]*\s[^\"\n]*\"\)'
    message: "Text(\"...\") must receive a localization key from the String Catalog, not a raw phrase."
    severity: error
  localization_key_only_in_navigation_title:
    name: "Hardcoded navigationTitle literal"
    regex: '\.navigationTitle\(\"[^\"\n]*\s[^\"\n]*\"\)'
    message: ".navigationTitle(\"...\") must receive a localization key, not a raw phrase."
    severity: error
  localization_key_only_in_button_label:
    name: "Hardcoded Button label literal"
    regex: 'Button\(\"[^\"\n]*\s[^\"\n]*\"'
    message: "Button(\"...\") must receive a localization key, not a raw phrase."
    severity: error

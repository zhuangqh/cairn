name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v, for example 0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: Build macOS DMG
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: brew install xcodegen swiftlint

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: make test

      - name: Run lint
        run: make lint

      - name: Build DMG
        run: make dmg VERSION=${{ steps.version.outputs.version }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cairn-${{ steps.version.outputs.version }}.dmg
          path: build/Cairn-${{ steps.version.outputs.version }}.dmg
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "build/Cairn-${{ steps.version.outputs.version }}.dmg" \
            --title "Cairn ${{ steps.version.outputs.version }}" \
            --generate-notes

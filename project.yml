name: Cairn
options:
  bundleIdPrefix: com.zhuangqh
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Cairn
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
    INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
targets:
  Cairn:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Cairn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhuangqh.cairn
        PRODUCT_NAME: Cairn
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Cairn/Support/Cairn.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  CairnTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: CairnTests
    dependencies:
      - target: Cairn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhuangqh.cairn.tests
        GENERATE_INFOPLIST_FILE: YES
      configs:
        Debug:
          TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Cairn.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Cairn"
          BUNDLE_LOADER: "$(TEST_HOST)"
        Release:
          TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Cairn.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Cairn"
          BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Cairn:
    build:
      targets:
        Cairn: all
        CairnTests: [test]
    test:
      targets:
        - CairnTests
      gatherCoverageData: true
    run:
      config: Debug
    archive:
      config: Release
